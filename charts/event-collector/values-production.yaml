replicaCount: 1

image:
  repository: ghcr.io/yangjie500/argocd-notification-collector
  tag: latest
  pullPolicy: IfNotPresent

app:
  environment: local
  logLevel: INFO
  docsEnabled: false

observability:
  enabled: true
  serviceName: event-collector
  otlpLogsEndpoint: xxx
  authorizationHeader:
    existingSecret: ""
    existingSecretKey: authorization-header
    value: "xxx"
  verifyTls: false

webhookToken:
  existingSecret: ""
  existingSecretKey: argocd-webhook-token
  value: ""

ingress:
  enabled: false

route:
  enabled: true
  host: "xxx"
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: false
